# docker compose up --build    ->  POST http://127.0.0.1:8000/run  and the panel at http://127.0.0.1:8000
# SAMPLE_MODE=true by default: no credentials, no network calls, no GPU. Both ports bind to 127.0.0.1 only.
services:
  falkordb:
    image: falkordb/falkordb:6.0.2@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    ports:
      - "127.0.0.1:${FALKORDB_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: what-leaves-open-agent:local
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      SAMPLE_MODE: ${SAMPLE_MODE:-true}
      HOST: 0.0.0.0        # inside the container only; published on the host's 127.0.0.1 (ports below)
      PORT: "8000"
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
