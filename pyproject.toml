[project]
name = "honest-memory"
version = "0.0.1"
description = "Agent memory on FalkorDB that checks every write before it becomes a fact."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["falkordb==1.8.0"]

[project.optional-dependencies]
# Exact versions, each published on PyPI at least two weeks before they were pinned (2026-10-15).
api = ["fastapi==0.142.2", "uvicorn==0.54.0"]
mcp = ["mcp==2.2.0"]
agent = ["openai==3.22.1"]
dev = ["pytest", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["honest_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
