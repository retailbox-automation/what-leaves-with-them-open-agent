<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Leaves With Them</title>
<meta name="description" content="Pick someone at a fictional company and see, from its FalkorDB graph, what leaves with them.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1224'/%3E%3Cg stroke='%234a9fd8' stroke-width='2'%3E%3Cpath d='M9 22 16 9l8 7-15 6'/%3E%3C/g%3E%3Cg fill='%234a9fd8'%3E%3Ccircle cx='16' cy='9' r='3.5'/%3E%3Ccircle cx='24' cy='16' r='3'/%3E%3Ccircle cx='9' cy='22' r='3.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-phase="loading">
  <svg id="zones" aria-hidden="true"></svg>
  <div id="cy" role="img" aria-label="The company graph: people, teams, systems and decisions"></div>
  <svg id="overlay" aria-hidden="true"></svg>
  <div id="labels" aria-hidden="true"></div>

  <header class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M11 27 20 10l10 9-19 8" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="20" cy="10" r="4.4"/><circle cx="30" cy="19" r="3.6"/><circle cx="11" cy="27" r="4.4"/>
    </svg>
    <div><div class="title">What Leaves With Them</div><div class="sub">on FalkorDB</div></div>
  </header>

  <h1 id="headline">Pick someone. See what leaves with them.</h1>

  <div id="counters" hidden>
    <div class="counter" data-k="islands"><b>0</b><span>systems nobody is connected to</span></div>
    <div class="counter" data-k="decisions"><b>0</b><span>decisions only they wrote</span></div>
    <div class="counter" data-k="bridges"><b>0</b><span>bridges between teams lost</span></div>
    <div id="wall" class="wall"></div>
  </div>

  <div id="picked" hidden>
    <button id="remove" type="button">Remove</button>
  </div>

  <div id="depth" hidden>
    <span class="depth-title">depth</span>
    <div id="slider" role="slider" tabindex="0" aria-label="How many hops to walk from the person" aria-valuemin="1" aria-valuemax="4" aria-valuenow="1">
      <div class="track"></div><div class="fill"></div>
      <button type="button" class="stop" data-d="1" tabindex="-1"><i></i><b>1</b><span class="cap" id="cap-1">what they own</span></button>
      <button type="button" class="stop" data-d="2" tabindex="-1"><i></i><b>2</b></button>
      <button type="button" class="stop" data-d="3" tabindex="-1"><i></i><b>3</b></button>
      <button type="button" class="stop" data-d="4" tabindex="-1"><i></i><b>4</b><span class="cap" id="cap-4">what depends on them</span></button>
    </div>
  </div>

  <div id="actions" hidden>
    <button id="plan" type="button" class="primary">Plan the handoff</button>
    <button id="again" type="button" class="secondary">Try someone else</button>
  </div>

  <aside id="game" hidden aria-live="polite">
    <div class="game-top">
      <div class="days"><b id="days">14</b> days left</div>
      <div class="saved"><span>Knowledge saved</span><b><em id="saved-n">0</em> / <i id="saved-of">0</i></b></div>
    </div>
    <div class="bar"><div id="bar-fill"></div></div>
    <div id="cards"></div>
  </aside>

  <aside id="handoff" hidden>
    <h2>Handoff</h2>
    <div id="handoff-rows"></div>
    <span class="chip">proposed - needs approval</span>
  </aside>

  <div id="promise" hidden>
    <button id="ask-promise" type="button" class="pill"></button>
    <div id="promise-reply" class="pill reply" hidden></div>
  </div>

  <div class="corner">
    <button id="restart" type="button" class="link" hidden>Try someone else</button>
    <button id="show-cypher" type="button" class="link">Show Cypher</button>
  </div>

  <section id="cypher" hidden aria-label="Cypher of the last action">
    <header><b id="cypher-title">Cypher</b><button id="cypher-close" type="button" aria-label="Close">&times;</button></header>
    <div id="cypher-body"></div>
  </section>

  <div id="tip" role="tooltip" hidden></div>
  <div id="status" aria-live="polite"></div>
</div>
<script src="vendor/cytoscape-3.34.3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
